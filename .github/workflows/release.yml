name: Build and publish Windows update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag $env:RELEASE_TAG does not match package version $version (expected $expectedTag)."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and publish NSIS release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Authenticode secrets if a signing certificate is added later:
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
